[project]
name = "cloudagent-opensandbox-deployment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["opensandbox-server==1.2.0"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
