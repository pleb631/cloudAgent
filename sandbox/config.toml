# Schema verified against OpenSandbox release-1.2.0.
# Authentication MUST be supplied through OPENSANDBOX_SERVER_API_KEY.
[server]
host = "127.0.0.1"
port = 8090
max_sandbox_timeout_seconds = 3600

[proxy]
resolve_internal = true

[runtime]
type = "docker"
execd_image = "opensandbox/execd:release-1.2.0"

[docker]
network_mode = "bridge"
publish_host = "127.0.0.1"
port_range_min = 40000
port_range_max = 41000
drop_capabilities = ["ALL"]
no_new_privileges = true
pids_limit = 256
sandbox_binds = []

[storage]
# Do not use []: upstream interprets that as permitting every host path.
# This reserved, nonexistent path is not used by CloudAgent.
allowed_host_paths = ["/var/empty/cloudagent-no-host-binds"]

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:release-1.2.0"
mode = "dns+nft"
disable_ipv6 = true
readiness_timeout_seconds = 30.0
