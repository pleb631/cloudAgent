name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agent, sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --frozen --group dev
      - name: Lint and format
        working-directory: ${{ matrix.service }}
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - name: Tests
        working-directory: ${{ matrix.service }}
        run: uv run --frozen pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build service images
        run: |
          docker build -t cloudagent-agent:ci agent
          docker build -t cloudagent-manager:ci sandbox
          docker build -t cloudagent-sandbox-runtime:local -f sandbox/Dockerfile.runtime sandbox
      - name: Docker integration tests
        working-directory: sandbox
        env:
          RUN_DOCKER_TESTS: "1"
          SANDBOX_IMAGE: cloudagent-sandbox-runtime:local
        run: uv run --frozen pytest -q -m docker
      - name: Validate Compose configuration
        env:
          CLOUDAGENT_API_KEYS: '{"ci-key-not-a-real-secret-at-least-32-characters":"ci"}'
          CLOUDAGENT_LLM_API_KEY: ci-not-real-key
          SANDBOX_TOKEN: ci-manager-token-not-real-at-least-32-characters
        run: docker compose config --quiet
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: python scripts/smoke_test.py
