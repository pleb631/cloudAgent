# Linux only. OpenHands is the sole implementation on this branch.
services:
  openhands-server-image:
    build:
      context: ./openhands
      dockerfile: server/Dockerfile
    image: cloudagent-openhands-server:1.62.0
    profiles: [image]
    entrypoint: ["/bin/true"]
  openhands-api:
    build: ./openhands
    network_mode: host
    environment:
      CLOUDAGENT_OH_API_KEYS: ${CLOUDAGENT_OH_API_KEYS:?Set API keys}
      CLOUDAGENT_OH_LLM_API_KEY: ${CLOUDAGENT_OH_LLM_API_KEY:?Set provider key}
      CLOUDAGENT_OH_LLM_BASE_URL: ${CLOUDAGENT_OH_LLM_BASE_URL:-https://api.openai.com/v1}
      CLOUDAGENT_OH_WORKSPACE_ROOTS: ${CLOUDAGENT_OH_WORKSPACE_ROOTS:?Set tenant host directories}
      CLOUDAGENT_OH_AGENTS_DIR: /app/agents
      CLOUDAGENT_OH_STATE_DIR: /state
      CLOUDAGENT_OH_DEPLOYMENT_ID: ${CLOUDAGENT_OH_DEPLOYMENT_ID:-cloudagent-oh}
      CLOUDAGENT_OH_SERVER_IMAGE: ${CLOUDAGENT_OH_SERVER_IMAGE:-cloudagent-openhands-server:1.62.0}
      CLOUDAGENT_OH_MAX_CONCURRENT_RUNS: ${CLOUDAGENT_OH_MAX_CONCURRENT_RUNS:-4}
      CLOUDAGENT_OH_RUN_TIMEOUT: ${CLOUDAGENT_OH_RUN_TIMEOUT:-300}
      CLOUDAGENT_OH_REQUEST_TIMEOUT: ${CLOUDAGENT_OH_REQUEST_TIMEOUT:-60}
      CLOUDAGENT_OH_MAX_REQUEST_BYTES: ${CLOUDAGENT_OH_MAX_REQUEST_BYTES:-1048576}
      CLOUDAGENT_OH_MAX_OUTPUT_BYTES: ${CLOUDAGENT_OH_MAX_OUTPUT_BYTES:-1048576}
      CLOUDAGENT_OH_SANDBOX_MEMORY: ${CLOUDAGENT_OH_SANDBOX_MEMORY:-1g}
      CLOUDAGENT_OH_SANDBOX_CPUS: ${CLOUDAGENT_OH_SANDBOX_CPUS:-1}
      CLOUDAGENT_OH_SANDBOX_PIDS: ${CLOUDAGENT_OH_SANDBOX_PIDS:-256}
    volumes:
      # Controller gets host-equivalent Docker authority. NEVER mount this in execution containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./openhands/agents:/app/agents:ro
      - openhands-state:/state
      # Read-only identical host path for validation; execution container mounts one tenant root rw.
      - type: bind
        source: ${CLOUDAGENT_OH_HOST_DATA_ROOT:?Set existing absolute host data root}
        target: ${CLOUDAGENT_OH_HOST_DATA_ROOT:?Set existing absolute host data root}
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 90s
    restart: unless-stopped
volumes:
  openhands-state:
