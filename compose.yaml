# Linux Docker host only. Trusted API services use host networking but bind loopback;
# execution containers created by OpenSandbox use their own bridge network namespace.
services:
  agent:
    build: ./agent
    network_mode: host
    command: [/app/.venv/bin/uvicorn, cloudagent.api:app, --host, "127.0.0.1", --port, "8000", --workers, "1"]
    environment:
      CLOUDAGENT_API_KEYS: ${CLOUDAGENT_API_KEYS:?Set CLOUDAGENT_API_KEYS in .env}
      CLOUDAGENT_LLM_API_KEY: ${CLOUDAGENT_LLM_API_KEY:?Set CLOUDAGENT_LLM_API_KEY in .env}
      CLOUDAGENT_LLM_BASE_URL: ${CLOUDAGENT_LLM_BASE_URL:-https://api.openai.com/v1}
      CLOUDAGENT_AGENTS_DIR: /app/agents
      CLOUDAGENT_OPENSANDBOX_DOMAIN: 127.0.0.1:8090
      CLOUDAGENT_OPENSANDBOX_API_KEY: ${OPENSANDBOX_SERVER_API_KEY:?Set OPENSANDBOX_SERVER_API_KEY in .env}
      CLOUDAGENT_SANDBOX_IMAGE: ${CLOUDAGENT_SANDBOX_IMAGE:-python:3.12-slim}
      CLOUDAGENT_SANDBOX_TTL_SECONDS: ${CLOUDAGENT_SANDBOX_TTL_SECONDS:-600}
      CLOUDAGENT_SANDBOX_CPU: ${CLOUDAGENT_SANDBOX_CPU:-1}
      CLOUDAGENT_SANDBOX_MEMORY: ${CLOUDAGENT_SANDBOX_MEMORY:-512Mi}
      CLOUDAGENT_MAX_SANDBOX_SESSIONS: ${CLOUDAGENT_MAX_SANDBOX_SESSIONS:-4}
      CLOUDAGENT_MAX_SANDBOX_SESSIONS_PER_TENANT: ${CLOUDAGENT_MAX_SANDBOX_SESSIONS_PER_TENANT:-2}
      CLOUDAGENT_MAX_CONCURRENT_RUNS: ${CLOUDAGENT_MAX_CONCURRENT_RUNS:-20}
      CLOUDAGENT_MAX_RUNS_PER_TENANT: ${CLOUDAGENT_MAX_RUNS_PER_TENANT:-4}
      CLOUDAGENT_MAX_CONCURRENT_MODEL_CALLS: ${CLOUDAGENT_MAX_CONCURRENT_MODEL_CALLS:-8}
      CLOUDAGENT_MAX_MODEL_CALLS_PER_TENANT: ${CLOUDAGENT_MAX_MODEL_CALLS_PER_TENANT:-4}
      CLOUDAGENT_MAX_MODEL_CALLS_PER_RUN: ${CLOUDAGENT_MAX_MODEL_CALLS_PER_RUN:-64}
      CLOUDAGENT_MAX_SUBAGENT_INVOCATIONS_PER_RUN: ${CLOUDAGENT_MAX_SUBAGENT_INVOCATIONS_PER_RUN:-32}
      CLOUDAGENT_REQUEST_TIMEOUT: ${CLOUDAGENT_REQUEST_TIMEOUT:-120}
      CLOUDAGENT_RUN_TIMEOUT: ${CLOUDAGENT_RUN_TIMEOUT:-300}
      CLOUDAGENT_MAX_REQUEST_BYTES: ${CLOUDAGENT_MAX_REQUEST_BYTES:-1048576}
    volumes:
      - ./agent/agents:/app/agents:ro
    depends_on:
      sandbox:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped

  sandbox:
    # The image runs the unmodified, locked official opensandbox-server==1.2.0.
    build: ./sandbox
    network_mode: host
    environment:
      HOME: /var/lib/opensandbox
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_SERVER_API_KEY:?Set OPENSANDBOX_SERVER_API_KEY in .env}
    volumes:
      # Host-equivalent authority belongs only to the trusted official server.
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-state:/var/lib/opensandbox
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  opensandbox-state:
